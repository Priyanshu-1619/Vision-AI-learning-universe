# Render Blueprint Specification for AI Learning Universe
# Single-Service Web Architecture (FastAPI + React 19 SPA)
services:
  - type: web
    name: ai-learning-universe
    runtime: python
    plan: free
    region: oregon
    buildCommand: bash build.sh
    startCommand: python start.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: NODE_VERSION
        value: 20.11.0
      - key: ENVIRONMENT
        value: production
      - key: DATA_DIR
        value: ./backend/data
